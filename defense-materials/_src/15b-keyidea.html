<!doctype html><html lang="uk"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
body { background: var(--black); color:#fff; }
.wrap { position:absolute; inset:0; padding: 110px 110px; display:flex; flex-direction:column; justify-content:center; }
.wrap::after { content:""; position:absolute; top:0; right:-4%; width:44%; height:100%; background: linear-gradient(120deg, transparent 40%, var(--red) 40.5% 41.6%, transparent 42%); }
.eyebrow { margin-bottom: 22px; }
.idea { font-size: 78px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.08; max-width: 1150px; position:relative; z-index:2; }
.idea em { color: var(--red); font-style: normal; }
.q { margin-top: 70px; font-size: 40px; font-weight: 800; letter-spacing:-0.01em; color:#d8d8d8; position:relative; z-index:2; }
.sub { margin-top: 14px; font-size: 22px; color:#9a9a9a; position:relative; z-index:2; }
</style></head><body>
<div class="wrap">
 <div class="eyebrow">Ключова думка проєкту</div>
 <div class="idea">Від каталогу до замовлення <em>за кілька кліків</em>, без зайвої реєстрації.</div>
 <div class="q">Ваші питання?</div>
 <div class="sub">New Balance Shop · Team 1 · дякуємо за увагу</div>
</div>
</body></html>
